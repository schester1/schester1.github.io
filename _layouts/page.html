<html>

{% include head.html %}

<body class="no-sidebar is-preload">
    <div id="page-wrapper">

        {% include header.html %}

        <!-- Main -->
        <div class="wrapper style1">
            <div class="container">
                <div class="row">
                    <div class="col-12" id="content">
                        <article id="main">
                            <header>
                                <h2>{{ page.title }}</h2>
                            </header>

                            {% if page.image %}
                            <a href="{{ page.image | absolute_url }}" class="image featured"><img src="{{ page.image | absolute_url }}" alt="" /></a>
                            {% endif %}

                            {{ content }}
                        </article>
                    </div>
                </div>
            </div>
        </div>

        {% include site_footer.html %}

    </div>

    {% include footer.html %}

</body>

</html>
